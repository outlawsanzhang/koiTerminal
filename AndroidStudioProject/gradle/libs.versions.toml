espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
material = "1.14.0"
composeMaterialIcon = "1.7.0-alpha01"
appcompat = "1.8.0"
# For versions when building with soong, see prebuilts/sdk/current/androidx/m2repository/ and external/
# <!-- UPDATE --> update versions against soong build
lifecycle = "2.11.0-alpha03"
commonsCompress = "1.28.0" # updated
androidxWindow = "1.6.0-alpha03"
# androidxWindow = "1.6.0-alpha02" # Not found
protobufPlugin = "0.10.0"
