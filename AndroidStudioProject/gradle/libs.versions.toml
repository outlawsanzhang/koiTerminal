protobuf-kotlinlite = { group = "com.google.protobuf", name = "protobuf-kotlin-lite", version.ref = "protobufKotlinLite" }
androidx-work = { group = "androidx.work", name = "work-runtime", version.ref = "androidxWork" }
io-grpc-core = { group = "io.grpc", name = "grpc-core", version.ref = "grpc" }
