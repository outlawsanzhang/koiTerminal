# System bootloader configuration
zerombr
bootloader --append=" crashkernel=auto" --location=mbr --boot-drive=vda

# Partition clearing information
ignoredisk --only-use=vda,vdb
clearpart --all --drives=vda,vdb

# Partition information
# vda: efi, boot, root
part /boot/efi --fstype="efi" --ondisk=vda --size=600 --fsoptions="umask=0077,shortname=winnt"
part /boot --fstype="ext4" --ondisk=vda --size=2048
part btrfs.1 --fstype="btrfs" --ondisk=vda --grow
# vdb: var (including home)
part btrfs.2 --fstype="btrfs" --ondisk=vdb --grow
# btrfs for root and var
btrfs none --label=silverblue-main-hardened_fedora --data=single btrfs.1
btrfs / --subvol --name=root LABEL=silverblue-main-hardened_fedora
btrfs none --label=silverblue-main-hardened_var --data=single btrfs.2
btrfs /var --subvol --name=var LABEL=silverblue-main-hardened_var

# Use text install
text

# Install source
#cdrom # This option is not working due to qemu making the cdrom a hard drive (/dev/vdb).

# This line is from a fresh Silverblue install
ostreesetup --osname="fedora" --remote="fedora" --url=file:///ostree/repo --ref=fedora/43/aarch64/silverblue --nogpg

# This line is from a Secureblue x86_64 install
# ostreecontainer --no-signature-verification --transport="oci" --url="/run/install/repo/silverblue-main-hardened-latest"

# Keyboard layouts
keyboard --vckeymap=us --xlayouts='us'

# System language
lang en_US.UTF-8

# License agreement
eula --agreed

# Network information
network --onboot=yes --bootproto=dhcp --activate

# Disable root user
rootpw --lock

# Create default user (password will be deleted later)
user --name=droid --groups=wheel --password=$6$f9y8RhpOf4kppQlt$FpXm5aOecAV8Hf9DQM4/gHMD.EPbkacI36OQEyS50Iqs0Y2fLnOWeEPGXDhaVZjHpNF4RhEdyRDxBDByffCGH/ --iscrypted

# Skip the Setup Agent on first boot
firstboot --disable

# X Window System configuration information
xconfig  --startxonboot

# System services
services --enabled="chronyd"

# System timezone
timezone UTC --utc

# Example timezone list
#timezone America/Los_Angeles --utc	# PST | UTC08:00
#timezone America/Denver --utc		# MST | UTC07:00
#timezone America/Chicago --utc		# CST | UTC06:00
#timezone America/New_York --utc	# EST | UTC05:00
#timezone Australia/Sydney --utc	# UTC+10:00
#timezone Australia/Perth --utc		# UTC+08:00
#timezone Europe/Saratov --utc		# UTC+04:00
#timezone Europe/London --utc		# UTC+00:00
#timezone Asia/Hong_Kong --utc		# UTC+08:00
#timezone Asia/Calcutta --utc		# UTC+05:30

# The state of the machine after the install completes. Leave commented for no action.
shutdown

# Post-install, nochroot
%post --interpreter=/usr/bin/bash --nochroot # --log=/mnt/sysimage/root/ks-post.log

set -x

# Remove password
chroot /mnt/sysroot/ passwd -d root
chroot /mnt/sysroot/ passwd -d droid

# Set up auto script running on boot (when autologin droid)
cat <<EOF >> /mnt/sysroot/var/home/droid/.bash_profile
    bash /var/home/droid/run_install_secureblue.sh
EOF

# Script reused to setup Secureblue on multiple boots.
cat <<'EOF' > /mnt/sysroot/var/home/droid/run_install_secureblue.sh
    set -ex
    # Execute bash script passed as a raw disk (/dev/vdc)
    # Do it in the background because run0 may disconnect due to emulation slowness
    echo '
        HISTFILE= && if bash -ex /dev/vdc
        then
            echo "Automatically shutting down in 5 seconds..."
            sleep 5
            poweroff
        else
            echo "Error: Secureblue installer step failed."
            echo "Press Ctrl+C to proceed to bash."
        fi &
        echo run0 background job PID: $!
    ' | run0
    sleep infinity
EOF
chmod a+x /mnt/sysroot/var/home/droid/run_install_secureblue.sh

# Setup serial console
# Note: crosvm currently has a quirk that it forcefully enables both ttyS0 and hvc0, AND THEN
#   redirects both to the same output stream. (See android/virtmgr/src/crosvm.rs:580 through 590)
#   When Secureblue sees this, it writes logs to both, leading to terminal control characters
#   interlacing with each other and messing up booting. Sometimes it boots with clean or messy logs,
#   but sometimes the boot hangs or modules time out.
#
#   Deduplicating kernel logging + getty (and bash) spawning is complicated by two issues:
#   Issue 1: There seems to be no way of turning off writing kernel logs to hvc0. (FIXME: PLS HELP)
#   Issue 2: We have to use `"console_input_device": "ttyS0"` in vm_config.json because grub ignores
#            hvc0. (FIXME: PLS HELP)
#
# Temporary fix:
#   Step 1: Only use `console=hvc0` to make the kernel think we only use hvc0, so it does not write
#           logs to ttyS0.
#   Step 2: Do not rely on `console=*` kernel parameter to spin up getty.
#           Instead, manually disable serial-getty@hvc0.service & enable serial-getty@ttyS0.service.
# The end result is that the kernel writes logs to hvc0, and both grub and getty use ttyS0.
# Both end up on our serial console because crosvm mandates so.

# Both ttyAMA0 (used by qemu) and ttyS0 (used in AVF, our vm_config.json) are enabled
ln -s /usr/lib/systemd/system/getty@.service /mnt/sysroot/etc/systemd/system/getty.target.wants/serial-getty@ttyAMA0.service
ln -s /usr/lib/systemd/system/getty@.service /mnt/sysroot/etc/systemd/system/getty.target.wants/serial-getty@ttyS0.service
SERIAL_GETTY="/mnt/sysroot/etc/systemd/system/serial-getty@ttyAMA0.service.d/override.conf"
SERIAL_GETTY_DIR="$(dirname ${SERIAL_GETTY})"
mkdir "${SERIAL_GETTY_DIR}"
cat <<EOF >> "${SERIAL_GETTY}"
[Service]
ExecStart=
EOF
grep ExecStart= /usr/lib/systemd/system/serial-getty@.service | sed 's;agetty ;agetty --autologin droid ;g' >> "${SERIAL_GETTY}"
cp -r "${SERIAL_GETTY_DIR}" "${SERIAL_GETTY_DIR/ttyAMA0/ttyS0}"
# Disable the serial console on hvc0 to reduce clutter, because there is no way to write to it with
# "console_input_device": "ttyS0" in `vm_config.json`.
ln -s /dev/null /mnt/sysroot/etc/systemd/system/serial-getty@hvc0.service

# Slow down gdm crashing
GDM="/mnt/sysroot/etc/systemd/system/gdm.service.d/override.conf"
mkdir "$(dirname ${GDM})"
cat <<EOF >> "${GDM}"
[Service]
# Gradually decrease restart speed
RestartSec=1s
RestartMaxDelaySec=1h
RestartSteps=10
[Unit]
# 15 restarts per day
StartLimitIntervalSec=1d
StartLimitBurst=15
EOF

# Device & service timeout fix
SYSTEM_CONF="/mnt/sysroot/etc/systemd/system.conf.d/50-override.conf"
mkdir "$(dirname ${SYSTEM_CONF})"
cat <<EOF >> "${SYSTEM_CONF}"
[Manager]
DefaultTimeoutStartSec=300
DefaultDeviceTimeoutSec=300
EOF

%end
