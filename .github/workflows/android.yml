name: Android debug CI

on:
  push:
    branches: [ koiterminal ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ koiterminal ]
    paths-ignore:
      - "**.md"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: cargo-bins/cargo-binstall@c06f6a0003f7c6165a00c89d1697731c9e8a5c72 # <!-- UPDATE --> Update version
      with:
        version: "1.25.2"
    - name: Build with Gradle
      run: |
        source ./.github/scripts/build-common.sh
        ./gradlew :app:assembleDebug
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        path: ./AndroidStudioProject/app/build/outputs/apk/debug/app-debug.apk
        archive: false
